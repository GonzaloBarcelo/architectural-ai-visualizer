[project]
name = "architectural-ai-visualizer"
version = "0.1.0"
description = "Source-traceable PDF to Blender and web architectural visualization"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openai>=2.0,<3", "pymupdf>=1.26,<2", "opencv-python-headless>=4.12,<5",
  "shapely>=2.1,<3", "numpy>=2.2,<3", "pydantic>=2.11,<3", "pillow>=11,<13"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "pyyaml>=6,<7"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires headless Blender"]
